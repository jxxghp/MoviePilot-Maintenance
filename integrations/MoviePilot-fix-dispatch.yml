# Copy to the target repository as .github/workflows/moviepilot-codex-fix.yml.
# This is the only normal entry point that grants Codex write permissions.
# Replace CONTROL_REF with a full 40-character SHA of the trusted control commit.
name: MoviePilot Codex approved fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or PR number to investigate.
        required: true
        type: string
      prompt_name:
        description: issue-fix, ci-fix, or delivery.
        required: false
        default: issue-fix
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  codex:
    uses: jxxghp/MoviePilot-Maintenance/.github/workflows/codex-fix.yml@CONTROL_REF
    with:
      control_repository: jxxghp/MoviePilot-Maintenance
      control_ref: CONTROL_REF
      prompt_name: ${{ inputs.prompt_name }}
      codex_model: ${{ vars.CODEX_MODEL }}
      codex_effort: ${{ vars.CODEX_EFFORT || 'high' }}
      openai_base_url: ${{ vars.OPENAI_BASE_URL }}
      publish_comments: true
      autofix_enabled: ${{ vars.CODEX_AUTOFIX_ENABLED == 'true' }}
      telegram_enabled: ${{ vars.TELEGRAM_ENABLED == 'true' }}
      telegram_chat_id: ${{ vars.TELEGRAM_CHAT_ID }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAINTENANCE_CONTROL_READ_TOKEN: ${{ secrets.MAINTENANCE_CONTROL_READ_TOKEN }}
      MAINTENANCE_TARGET_GH_TOKEN: ${{ secrets.MAINTENANCE_TARGET_GH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
