# Trusted Codex CLI permission profiles used by the GitHub Action.
# This file is fetched from the pinned control commit before Codex starts.

default_permissions = "moviepilot-analysis-net"

[features]
network_proxy = true

[permissions.moviepilot-analysis-net]
description = "Read MoviePilot facts with a writable target clone and public research network."
extends = ":read-only"

[permissions.moviepilot-analysis-net.filesystem.":workspace_roots"]
target = "write"

[permissions.moviepilot-analysis-net.network]
enabled = true

[permissions.moviepilot-analysis-net.network.domains]
# Codex must research official documentation, upstream Issues, standards, and
# public dependency information. The proxy keeps local/private targets blocked
# by default; prompts must not upload secrets.
"*" = "allow"

[permissions.moviepilot-workspace-net]
description = "Edit the target workspace with public research network."
extends = ":workspace"

[permissions.moviepilot-workspace-net.network]
enabled = true

[permissions.moviepilot-workspace-net.network.domains]
"*" = "allow"
